{# PIN-based delivery estimate. Updates [data-eta-line] rows on the page. Expects optional default_pin. #}
<div class="fd-deliver-to" data-delivery-check data-url="{% url 'delivery_estimate' '000000' %}" data-default-pin="{{ default_pin|default:'' }}"{% if show_custom %} data-show-custom{% endif %}>
  <svg width="18" height="18" aria-hidden="true"><use xlink:href="#truck"></use></svg>
  <form class="fd-deliver-form" novalidate>
    <label for="deliver-pin-{{ forloop.counter|default:'x' }}" class="fd-deliver-label">Deliver to</label>
    <input type="text" id="deliver-pin-{{ forloop.counter|default:'x' }}" class="form-control" inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6" placeholder="PIN code" autocomplete="postal-code" data-delivery-pin>
    <button type="submit" class="fd-text-btn is-strong">Check</button>
  </form>
  <p class="fd-deliver-result" data-delivery-result aria-live="polite"></p>
</div>
