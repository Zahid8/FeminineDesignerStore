{# Optional Google Maps pin for delivery. Expects: form, field_id #}
<div class="fd-location-field" x-data="{ busy: false, err: '', locate() { if (!navigator.geolocation) { this.err = 'Your browser can\'t share your location — paste a Google Maps link instead.'; return; } this.busy = true; this.err = ''; navigator.geolocation.getCurrentPosition(p => { this.$refs.url.value = 'https://www.google.com/maps?q=' + p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6); this.busy = false; }, () => { this.busy = false; this.err = 'We couldn\'t get your location. Allow location access, or paste a Google Maps link.'; }, { enableHighAccuracy: true, timeout: 15000 }); } }">
  <label for="{{ field_id }}" class="form-label">Google Maps location <span class="text-muted fw-normal">(optional)</span></label>
  <div class="fd-location-row">
    <input type="url" inputmode="url" name="location_url" id="{{ field_id }}" x-ref="url" class="form-control{% if form.location_url.errors %} is-invalid{% endif %}" maxlength="2000" placeholder="https://maps.app.goo.gl/…" value="{{ form.location_url.value|default:'' }}" aria-describedby="{{ field_id }}-help">
    <button type="button" class="btn btn-outline-dark fd-location-btn" @click="locate()" :disabled="busy"><svg width="16" height="16" aria-hidden="true"><use xlink:href="#pin"></use></svg><span x-text="busy ? 'Finding you…' : 'Use my current location'">Use my current location</span></button>
  </div>
  {% for e in form.location_url.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
  <p class="text-danger small mt-1 mb-0" x-show="err" x-text="err" style="display:none"></p>
  <p class="form-text mb-0" id="{{ field_id }}-help">Helps our delivery partner find your door. In Google Maps, tap your home &rarr; Share &rarr; Copy link, and paste it here.</p>
</div>
