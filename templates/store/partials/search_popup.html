<div class="search-popup" role="dialog" aria-modal="true" aria-label="Search the store">
  <button type="button" class="btn-close-search" aria-label="Close search">
    <svg width="20" height="20" aria-hidden="true"><use xlink:href="#close"></use></svg>
  </button>
  <div class="search-popup-container">
    <span class="fd-eyebrow">Search</span>
    <form role="search" method="get" class="search-popup-form form-group" action="{% url 'product_list' %}" data-live-search="{% url 'product_list' %}">
      <label for="search-form" class="visually-hidden">Search products</label>
      <input type="search" id="search-form" class="form-control border-0 border-bottom"
        placeholder="Silk, embroidered, cotton…" value="" name="q" autocomplete="off">
      <button type="submit" class="search-submit border-0 position-absolute bg-white" aria-label="Submit search">
        <svg class="search" width="24" height="24" aria-hidden="true">
          <use xlink:href="#search"></use>
        </svg>
      </button>
    </form>
    <p class="fd-search-status" data-search-status aria-live="polite"></p>
    <div class="fd-search-results" data-search-results></div>
    {% if categories %}
    <h5 class="cat-list-title">Browse Collections</h5>
    <ul class="cat-list">
      {% for cat in categories %}
      <li class="cat-list-item">
        <a href="{% url 'product_list' %}?category={{ cat.slug }}">{{ cat.name }}</a>
      </li>
      {% endfor %}
    </ul>
    {% endif %}
  </div>
</div>
