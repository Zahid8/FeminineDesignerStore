{# Inline blouse diagram; numbers match the measurement list. #}
<figure class="fd-guide" aria-label="Where to measure">
  <svg viewBox="0 0 320 360" role="img" aria-hidden="true">
    <defs><marker id="mg-dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4"><circle cx="3" cy="3" r="3" fill="currentColor"/></marker></defs>
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <!-- blouse outline -->
      <path d="M118 62 C128 78 150 86 160 86 C170 86 192 78 202 62 L250 76 C262 94 270 110 274 128 L246 142 L240 118 L238 290 C212 300 184 304 160 304 C136 304 108 300 82 290 L80 118 L74 142 L46 128 C50 110 58 94 70 76 Z"/>
      <path d="M118 62 C132 74 148 78 160 78 C172 78 188 74 202 62" opacity=".5"/>
      <!-- sleeve seams -->
      <path d="M80 118 C92 110 100 96 102 76" opacity=".5"/><path d="M240 118 C228 110 220 96 218 76" opacity=".5"/>
    </g>
    <g class="fd-guide-dims" fill="none" stroke="var(--fd-accent)" stroke-width="1.2" stroke-dasharray="3 3">
      <path d="M60 70 L60 300" marker-start="url(#mg-dot)" marker-end="url(#mg-dot)"/>        <!-- 1 length -->
      <path d="M86 150 L234 150" marker-start="url(#mg-dot)" marker-end="url(#mg-dot)"/>      <!-- 2 bust -->
      <path d="M92 218 L228 218" marker-start="url(#mg-dot)" marker-end="url(#mg-dot)"/>      <!-- 3 waist -->
      <path d="M102 76 C96 96 92 108 84 120" marker-start="url(#mg-dot)" marker-end="url(#mg-dot)"/> <!-- 4 armhole -->
      <path d="M248 142 L274 128" marker-start="url(#mg-dot)" marker-end="url(#mg-dot)"/>     <!-- 5 opening -->
      <path d="M230 100 L262 92" marker-start="url(#mg-dot)" marker-end="url(#mg-dot)"/>      <!-- 6 upper arm -->
      <path d="M160 86 L160 118" marker-start="url(#mg-dot)" marker-end="url(#mg-dot)"/>      <!-- 8 front neck -->
    </g>
    <g class="fd-guide-nums" font-family="var(--fd-font-body)" font-size="11" font-weight="600" fill="#fff">
      <g><circle cx="60" cy="182" r="9" fill="var(--fd-accent)"/><text x="60" y="186" text-anchor="middle">1</text></g>
      <g><circle cx="160" cy="150" r="9" fill="var(--fd-accent)"/><text x="160" y="154" text-anchor="middle">2</text></g>
      <g><circle cx="160" cy="218" r="9" fill="var(--fd-accent)"/><text x="160" y="222" text-anchor="middle">3</text></g>
      <g><circle cx="78" cy="98" r="9" fill="var(--fd-accent)"/><text x="78" y="102" text-anchor="middle">4</text></g>
      <g><circle cx="272" cy="148" r="9" fill="var(--fd-accent)"/><text x="272" y="152" text-anchor="middle">5</text></g>
      <g><circle cx="256" cy="80" r="9" fill="var(--fd-accent)"/><text x="256" y="84" text-anchor="middle">6</text></g>
      <g><circle cx="176" cy="104" r="9" fill="var(--fd-accent)"/><text x="176" y="108" text-anchor="middle">8</text></g>
    </g>
  </svg>
  <figcaption>Measure over a well-fitting blouse or your inner wear, tape snug but not tight. Numbers match the fields.</figcaption>
</figure>
