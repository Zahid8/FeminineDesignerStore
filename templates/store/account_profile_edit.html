{% extends "base.html" %}
{% block title %} — Edit Profile{% endblock %}
{% block content %}
<header class="fd-page-header pb-4">
  <div class="container-lg">
    <ol class="fd-crumbs" aria-label="Breadcrumb"><li><a href="{% url 'account_profile' %}">Account</a></li><li aria-current="page">Edit</li></ol>
    <h1>Edit Profile</h1>
  </div>
</header>
<section class="pb-5">
  <div class="container-lg page-shell">
    <div class="indichic-card p-4 p-md-5">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="pe-first_name">First Name</label>
            <input type="text" id="pe-first_name" name="first_name" class="form-control" value="{{ form.first_name.value|default:'' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="pe-last_name">Last Name</label>
            <input type="text" id="pe-last_name" name="last_name" class="form-control" value="{{ form.last_name.value|default:'' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="pe-email">Email</label>
            <input type="email" id="pe-email" name="email" class="form-control" value="{{ form.email.value|default:'' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="pe-phone">Phone</label>
            <input type="text" id="pe-phone" name="phone" class="form-control" value="{{ form.phone.value|default:'' }}">
          </div>
          <div class="col-12">
            <label class="form-label" for="pe-shipping_address">Shipping Address</label>
            <textarea id="pe-shipping_address" name="shipping_address" class="form-control" rows="3">{{ form.shipping_address.value|default:'' }}</textarea>
          </div>
          <div class="col-12">
            <label class="form-label" for="pe-profile_image">Profile Image</label>
            <input type="file" id="pe-profile_image" name="profile_image" class="form-control">
          </div>
          <div class="col-12 mt-3">
            <button type="submit" class="btn btn-dark rounded-pill">Save Changes</button>
            <a href="{% url 'account_profile' %}" class="btn btn-outline-dark rounded-pill ms-2">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
