{% extends "base.html" %}
{% block title %} — Check your email{% endblock %}
{% block content %}
<section class="fd-section">
  <div class="container-lg page-shell text-center">
    <span class="fd-eyebrow is-center">Account</span>
    <h1 class="h2">Check your email</h1>
    <p class="text-muted">If an account exists for that address, a reset link is on its way. It may take a few minutes to arrive.</p>
    <a href="{% url 'account_login' %}" class="btn btn-outline-dark mt-3">Back to Sign In</a>
  </div>
</section>
{% endblock %}
