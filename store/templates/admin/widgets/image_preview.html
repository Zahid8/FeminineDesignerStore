<div class="fd-image-field">
  {% if widget.is_initial %}
  <a href="{{ widget.value.url }}" target="_blank" rel="noopener" class="fd-image-preview" title="Open full size" style="flex:none;display:block;width:40px;height:40px;border-radius:8px;overflow:hidden">
    <img src="{{ widget.value.url }}" alt="Current image" width="40" height="40" loading="lazy" style="width:40px;height:40px;max-width:40px;object-fit:cover;display:block">
  </a>
  {% endif %}
  <div class="fd-image-controls">
    {% if widget.is_initial %}
    <span class="fd-image-name">{{ widget.value.name|cut:"products/" }}</span>
    {% if not widget.required %}<label class="fd-image-clear"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.checked %} checked{% endif %}> {{ widget.clear_checkbox_label }}</label>{% endif %}
    <span class="fd-image-change">{{ widget.input_text }}:</span>
    {% endif %}
    <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
  </div>
</div>
